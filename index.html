<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vencr — Documentos Legales</title>
<style>
  :root {
    --bg: #0F0805;
    --surface: #1A0E08;
    --accent: #FF6A1A;
    --text: #F5EFE0;
    --text-dim: rgba(245, 239, 224, 0.65);
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px;
  }
  h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 16px;
    margin-bottom: 40px;
  }
  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-desc {
    color: var(--text-dim);
    font-size: 14px;
  }
  .arrow {
    float: right;
    color: var(--accent);
    font-size: 20px;
  }
  footer {
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Vencr</h1>
  <p class="subtitle">Documentos legales</p>

  <a class="card" href="/privacy_policy.html">
    <span class="arrow">→</span>
    <div class="card-title">Política de Privacidad</div>
    <div class="card-desc">Cómo recopilamos, usamos y protegemos tu información</div>
  </a>

  <a class="card" href="/terms_of_service.html">
    <span class="arrow">→</span>
    <div class="card-title">Términos de Servicio</div>
    <div class="card-desc">Condiciones de uso de la aplicación</div>
  </a>

  <footer>
    Contacto: vencrapp@gmail.com
  </footer>
</div>
</body>
</html>
