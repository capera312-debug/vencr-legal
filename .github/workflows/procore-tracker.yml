name: Procore Tracker

# NO ACTIVO POR AHORA: este workflow necesita autenticarse sin intervención
# humana, lo cual requiere el modo "client_credentials" (una Developer
# Managed Service Account / DMSA habilitada por Procore para tu app — no es
# self-service, hay que pedírsela a Procore). Mientras tanto, el tracker
# corre localmente con login de usuario (ver README.md, "Automatízalo en tu
# compu" con el Programador de Tareas de Windows).
#
# Cuando tengas la DMSA: agrega PROCORE_AUTH_MODE=client_credentials como
# secret/variable, y este workflow queda listo para usarse.
#
# Nota aparte: GitHub solo dispara workflows programados (schedule) desde el
# branch por defecto del repo (normalmente "main").
on:
  schedule:
    # Todos los días de semana a las 13:00 UTC (~8am hora ET). Ajusta el cron
    # a tu huso horario / frecuencia deseada.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r procore-tracker/requirements.txt

      - name: Ejecutar tracker
        working-directory: procore-tracker
        env:
          PROCORE_CLIENT_ID: ${{ secrets.PROCORE_CLIENT_ID }}
          PROCORE_CLIENT_SECRET: ${{ secrets.PROCORE_CLIENT_SECRET }}
          PROCORE_COMPANY_ID: ${{ secrets.PROCORE_COMPANY_ID }}
          PROCORE_PROJECT_ID: ${{ secrets.PROCORE_PROJECT_ID }}
          PROCORE_AUTH_MODE: client_credentials
        run: python tracker.py

      - name: Commitear el nuevo reporte y el estado
        run: |
          git config user.name "procore-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add procore-tracker/reports procore-tracker/state
          git diff --cached --quiet || git commit -m "Reporte automático de Procore ($(date -u +%Y-%m-%d))"
          git push
